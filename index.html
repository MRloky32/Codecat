<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codecat - Aprende a Programar</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header style="padding: 20px; text-align: center;">
        <img src="logo.jpeg" alt="Logo Codecat" style="max-height: 80px;">
    </header>

    <main style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;">
        <h1 style="color: var(--color-primary); font-size: 3rem;">Bienvenido al Futuro</h1>
        <p style="color: var(--text-muted);">Aprende programación de forma totalmente dinámica e interactiva.</p>
        
        <button style="background-color: var(--bg-accent); color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 1.2rem; cursor: pointer;">
            Comenzar mi Curso
        </button>
    </main>

    <footer style="padding: 20px; color: var(--text-muted); font-size: 0.8rem;">
        &copy; 2026 Codecat CUCEI. Proyecto Modular.
    </footer>

</body>
</html>
